name: release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N, published as a pre-release)
# builds netker for amd64 and arm64 and publishes a GitHub release with
# the binaries, their SHA-256 sums and build provenance attestations.
#
# The tag must point at a commit on main, which the other workflows have
# already tested; this workflow only rechecks what the binaries embed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git describe and the main check need history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at a commit that isn't on main"
            exit 1
          fi

      # The binaries embed these objects; they must match bpf/.
      - name: Generated BPF objects are up to date
        run: make check-generate

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch make build VERSION="$TAG"
            mv bin/netker "dist/netker-$TAG-linux-$arch"
          done
          ./"dist/netker-$TAG-linux-amd64" version | grep -qF "netker $TAG " || {
            echo "::error::the binary doesn't report version $TAG"
            exit 1
          }
          (cd dist && sha256sum netker-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/netker-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "netker $TAG")
          [[ "$TAG" == *-rc.* ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" dist/*
